name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcode-select -p

      - name: Verify project
        run: |
          echo "Project directory:"
          pwd

          echo "Project contents:"
          ls -la

          echo "Checking Xcode project:"
          test -d OptionAnalyzer.xcodeproj
          test -f OptionAnalyzer.xcodeproj/project.pbxproj

          echo "project.pbxproj:"
          ls -lh OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Show targets and schemes
        run: |
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Build OptionAnalyzer
        run: |
          set -o pipefail

          rm -rf "$PWD/build"

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_VERSION=5.0 \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify app
        run: |
          echo "Searching for OptionAnalyzer.app:"
          find build -type d -name "OptionAnalyzer.app" -print

          test -d "build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          echo "App successfully created:"
          ls -lah "build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

      - name: Package iOS app
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          ditto \
            "build/Build/Products/Debug-iphoneos/OptionAnalyzer.app" \
            "artifacts/OptionAnalyzer.app"

          cd artifacts

          zip -r \
            OptionAnalyzer-iOS-Debug.zip \
            OptionAnalyzer.app

          echo "Package created:"
          ls -lh OptionAnalyzer-iOS-Debug.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip
          if-no-files-found: error