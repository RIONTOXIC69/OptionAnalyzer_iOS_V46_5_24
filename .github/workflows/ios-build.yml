name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app
          xcodebuild -version
          swift --version

      - name: Verify project files
        run: |
          echo "Current directory:"
          pwd

          echo "Project contents:"
          ls -la

          echo "Xcode project:"
          ls -la OptionAnalyzer.xcodeproj

          test -f OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Validate Xcode project
        run: |
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -list

      - name: Build iOS Simulator app
        run: |
          set -o pipefail

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify simulator app
        run: |
          echo "Searching for OptionAnalyzer.app:"
          find build -type d -name "OptionAnalyzer.app" -print

          test -d "build/Build/Products/Debug-iphonesimulator/OptionAnalyzer.app"

      - name: Package simulator app
        run: |
          mkdir -p artifacts

          ditto \
            "build/Build/Products/Debug-iphonesimulator/OptionAnalyzer.app" \
            "artifacts/OptionAnalyzer.app"

          cd artifacts
          zip -r OptionAnalyzer-iOS-Simulator-Debug.zip OptionAnalyzer.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Simulator-Debug
          path: artifacts/OptionAnalyzer-iOS-Simulator-Debug.zip