name: OptionAnalyzer iOS Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose Xcode Project
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Xcode environment
        run: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Xcode ==="
          xcode-select -p
          xcodebuild -version

          echo "=== SDKs ==="
          xcodebuild -showsdks

      - name: Inspect project
        run: |
          echo "=== Project ==="
          ls -la

          echo "=== Xcode project ==="
          find . -maxdepth 2 -name "*.xcodeproj" -print

          echo "=== Project file ==="
          ls -lh OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Validate project plist
        run: |
          plutil -lint OptionAnalyzer.xcodeproj/project.pbxproj

      - name: List Xcode project
        run: |
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Show build settings
        run: |
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -showBuildSettings \
            -sdk iphoneos

      - name: Check generic iOS destination
        run: |
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -showdestinations

      - name: Diagnostic complete
        run: |
          echo "Xcode project diagnostic completed."