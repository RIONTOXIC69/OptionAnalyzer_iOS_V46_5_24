name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select available Xcode
        run: |
          set -e

          echo "=== Installed Xcode versions ==="
          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=""

          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode.app
          do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: No Xcode installation found."
            exit 1
          fi

          echo "Using Xcode: $XCODE_APP"

          sudo xcode-select -s "$XCODE_APP"

          echo "=== Selected Xcode ==="
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -e

          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen already installed."
          else
            echo "Installing XcodeGen..."
            brew install xcodegen
          fi

          echo "=== XcodeGen version ==="
          xcodegen version

      - name: Verify source files
        run: |
          set -e

          echo "=== Source files ==="

          test -f project.yml
          test -f OptionAnalyzerApp.swift
          test -f API/Models.swift
          test -f API/OptionAnalyzerAPIClient.swift
          test -f Views/ContentView.swift
          test -f Views/MTFRow.swift
          test -f Views/StageCard.swift
          test -f Info.plist

          echo "All required source files found."

      - name: Generate fresh Xcode project
        run: |
          set -e

          echo "=========================================="
          echo " GENERATING FRESH XCODE PROJECT"
          echo "=========================================="

          rm -rf OptionAnalyzer.xcodeproj

          xcodegen generate \
            --spec project.yml \
            --project OptionAnalyzer.xcodeproj

          echo "=== Generated project ==="
          find OptionAnalyzer.xcodeproj -maxdepth 3 -type f -print

          test -f OptionAnalyzer.xcodeproj/project.pbxproj

          echo "Fresh Xcode project generated successfully."

      - name: Verify generated project
        run: |
          set -e

          echo "=== Project information ==="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Verify generated scheme
        run: |
          set -e

          echo "=== Generated schemes ==="

          find OptionAnalyzer.xcodeproj \
            -type f \
            -name "*.xcscheme" \
            -print

          test -f \
            OptionAnalyzer.xcodeproj/xcshareddata/xcschemes/OptionAnalyzer.xcscheme

          echo "OptionAnalyzer shared scheme found."

      - name: Clean Xcode build data
        run: |
          set -e

          rm -rf "$PWD/build"
          rm -rf "$PWD/artifacts"

          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"

          mkdir -p "$PWD/build"
          mkdir -p "$PWD/artifacts"

      - name: Show generated build settings
        run: |
          set -e

          echo "=== Generated project build settings ==="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -configuration Debug \
            -showBuildSettings

      - name: Build OptionAnalyzer
        run: |
          set -o pipefail

          echo "=========================================="
          echo " BUILDING OPTIONANALYZER"
          echo "=========================================="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Locate application
        run: |
          set -e

          echo "=== Searching for OptionAnalyzer.app ==="

          find "$PWD/build" \
            -type d \
            -name "OptionAnalyzer.app" \
            -print

          APP_PATH="$PWD/build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: OptionAnalyzer.app was not created."
            exit 1
          fi

          echo "=== Application found ==="
          ls -lah "$APP_PATH"

      - name: Package iOS application
        run: |
          set -e

          APP_PATH="$PWD/build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          rm -rf artifacts/OptionAnalyzer.app

          ditto \
            "$APP_PATH" \
            "artifacts/OptionAnalyzer.app"

          cd artifacts

          zip -r \
            OptionAnalyzer-iOS-Debug.zip \
            OptionAnalyzer.app

          echo "=== Package created ==="
          ls -lh OptionAnalyzer-iOS-Debug.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip
          if-no-files-found: error

