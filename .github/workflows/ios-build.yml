name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select available Xcode
        shell: bash
        run: |
          set -e

          echo "=== Installed Xcode ==="
          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=""

          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode.app
          do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: No Xcode installation found."
            exit 1
          fi

          echo "Using: $XCODE_APP"

          sudo xcode-select -s "$XCODE_APP"

          echo "=== Selected Xcode ==="
          xcode-select -p
          xcodebuild -version

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "=== Working directory ==="
          pwd

          echo "=== Project files ==="
          ls -la

          echo "=== Xcode project ==="
          test -d OptionAnalyzer.xcodeproj
          test -f OptionAnalyzer.xcodeproj/project.pbxproj

          echo "Project verified."

      - name: Verify target
        shell: bash
        run: |
          set -e

          echo "=== Available project targets ==="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Verify scheme file
        shell: bash
        run: |
          set -e

          echo "=== Scheme files ==="

          find OptionAnalyzer.xcodeproj \
            -type f \
            -name "*.xcscheme" \
            -print

          if [ ! -f "OptionAnalyzer.xcodeproj/xcshareddata/xcschemes/OptionAnalyzer.xcscheme" ]; then
            echo "WARNING: Shared scheme not found."
            echo "Continuing with direct target build."
          else
            echo "Shared OptionAnalyzer scheme found."
          fi

      - name: Clean Xcode build data
        shell: bash
        run: |
          set -e

          echo "=== Cleaning previous Xcode data ==="

          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$PWD/build"
          rm -rf "$PWD/artifacts"

          mkdir -p "$PWD/artifacts"

      - name: Build OptionAnalyzer
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "DIRECT TARGET BUILD"
          echo "======================================"

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -target OptionAnalyzer \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Locate application
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR OPTIONANALYZER.APP"
          echo "======================================"

          echo "=== DerivedData ==="

          find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -name "OptionAnalyzer.app" \
            -print || true

          echo "=== Current workspace ==="

          find "$PWD" \
            -type d \
            -name "OptionAnalyzer.app" \
            -print || true

          APP_PATH=""

          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -path "*/Build/Products/Debug-iphoneos/OptionAnalyzer.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: OptionAnalyzer.app was not created."
            exit 1
          fi

          echo "FOUND:"
          echo "$APP_PATH"

          echo "$APP_PATH" > "$PWD/app_path.txt"

      - name: Package iOS application
        shell: bash
        run: |
          set -e

          APP_PATH="$(cat "$PWD/app_path.txt")"

          echo "Packaging:"
          echo "$APP_PATH"

          rm -rf "$PWD/artifacts/OptionAnalyzer.app"

          ditto \
            "$APP_PATH" \
            "$PWD/artifacts/OptionAnalyzer.app"

          cd "$PWD/artifacts"

          zip -r \
            OptionAnalyzer-iOS-Debug.zip \
            OptionAnalyzer.app

          echo "======================================"
          echo "PACKAGE CREATED"
          echo "======================================"

          ls -lh OptionAnalyzer-iOS-Debug.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip
          if-no-files-found: error