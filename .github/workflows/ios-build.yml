name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          echo "Xcode:"
          xcodebuild -version
          echo "Developer directory:"
          xcode-select -p

      - name: Verify project
        run: |
          echo "Working directory:"
          pwd

          echo "Project:"
          ls -la OptionAnalyzer.xcodeproj

          echo "Project file:"
          ls -lh OptionAnalyzer.xcodeproj/project.pbxproj

          test -d OptionAnalyzer.xcodeproj
          test -f OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Show project information
        run: |
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Clean build folder
        run: |
          rm -rf build
          mkdir -p build

      - name: Build OptionAnalyzer
        run: |
          set -o pipefail

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify app
        run: |
          echo "Searching for OptionAnalyzer.app..."

          find build \
            -type d \
            -name "OptionAnalyzer.app" \
            -print

          test -d "build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          echo "OptionAnalyzer.app successfully created."

          ls -lah \
            "build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

      - name: Package iOS app
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          ditto \
            "build/Build/Products/Debug-iphoneos/OptionAnalyzer.app" \
            "artifacts/OptionAnalyzer.app"

          cd artifacts

          zip -r \
            OptionAnalyzer-iOS-Debug.zip \
            OptionAnalyzer.app

          echo "Package:"
          ls -lh OptionAnalyzer-iOS-Debug.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip
          if-no-files-found: error