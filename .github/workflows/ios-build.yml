name: Diagnose OptionAnalyzer Xcode Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app
          xcodebuild -version

      - name: Inspect project structure
        run: |
          echo "=== PROJECT ==="
          ls -la OptionAnalyzer.xcodeproj

          echo "=== PBXPROJ SIZE ==="
          wc -l OptionAnalyzer.xcodeproj/project.pbxproj

          echo "=== PBXPROJ HEADER ==="
          head -30 OptionAnalyzer.xcodeproj/project.pbxproj

          echo "=== PBXPROJ FOOTER ==="
          tail -30 OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Validate pbxproj
        run: |
          echo "=== PLIST VALIDATION ==="
          plutil -lint OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Inspect Xcode project
        run: |
          echo "=== XCODE LIST ==="
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Diagnose complete
        run: |
          echo "Project diagnostic finished."