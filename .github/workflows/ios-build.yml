name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Verify project
        run: |
          test -d OptionAnalyzer.xcodeproj
          test -f OptionAnalyzer.xcodeproj/project.pbxproj

          echo "Project:"
          ls -la OptionAnalyzer.xcodeproj

      - name: Show targets
        run: |
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Test target build settings
        run: |
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -target OptionAnalyzer \
            -configuration Debug \
            -sdk iphoneos \
            -showBuildSettings

      - name: Build OptionAnalyzer target
        run: |
          set -o pipefail

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -target OptionAnalyzer \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify app
        run: |
          echo "Searching for application:"
          find build -type d -name "OptionAnalyzer.app" -print

          test -d "build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

      - name: Package iOS app
        run: |
          mkdir -p artifacts

          ditto \
            "build/Build/Products/Debug-iphoneos/OptionAnalyzer.app" \
            "artifacts/OptionAnalyzer.app"

          cd artifacts
          zip -r OptionAnalyzer-iOS-Debug.zip OptionAnalyzer.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip