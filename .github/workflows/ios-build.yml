name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select available Xcode
        run: |
          set -e

          echo "=== Installed Xcode ==="
          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=""

          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode.app
          do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: No Xcode installation found."
            exit 1
          fi

          echo "Using: $XCODE_APP"

          sudo xcode-select -s "$XCODE_APP"

          xcode-select -p
          xcodebuild -version

      - name: Verify project
        run: |
          set -e

          echo "=== Project ==="
          pwd
          ls -la

          test -d OptionAnalyzer.xcodeproj
          test -f OptionAnalyzer.xcodeproj/project.pbxproj

          echo "Project verified."

      - name: Verify target
        run: |
          set -e

          echo "=== Xcode targets ==="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Clean build
        run: |
          set -e

          rm -rf "$PWD/build"
          rm -rf "$PWD/artifacts"

          mkdir -p "$PWD/build"
          mkdir -p "$PWD/artifacts"

      - name: Direct target build
        run: |
          set -o pipefail

          echo "======================================"
          echo "DIRECT TARGET BUILD"
          echo "======================================"

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -target OptionAnalyzer \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify application
        run: |
          set -e

          echo "=== Searching for OptionAnalyzer.app ==="

          find "$PWD/build" \
            -type d \
            -name "OptionAnalyzer.app" \
            -print

          APP_PATH="$PWD/build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: OptionAnalyzer.app was not created."
            echo "=== Build directory ==="
            find "$PWD/build" -maxdepth 5 -print
            exit 1
          fi

          echo "=== APP CREATED SUCCESSFULLY ==="
          ls -lah "$APP_PATH"

      - name: Package application
        run: |
          set -e

          APP_PATH="$PWD/build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          ditto \
            "$APP_PATH" \
            "artifacts/OptionAnalyzer.app"

          cd artifacts

          zip -r \
            OptionAnalyzer-iOS-Debug.zip \
            OptionAnalyzer.app

          echo "=== PACKAGE CREATED ==="
          ls -lh OptionAnalyzer-iOS-Debug.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip
          if-no-files-found: error