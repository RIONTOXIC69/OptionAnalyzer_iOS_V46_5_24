name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect and select Xcode
        run: |
          set -e

          echo "=== Installed Xcode versions ==="
          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          echo "=== Current developer directory ==="
          xcode-select -p || true

          echo "=== Selecting available Xcode ==="

          XCODE_APP=""

          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode.app
          do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: No supported Xcode installation was found."
            echo "Available applications:"
            ls -la /Applications
            exit 1
          fi

          echo "Using Xcode: $XCODE_APP"

          sudo xcode-select -s "$XCODE_APP"

          echo "=== Selected Xcode ==="
          xcode-select -p
          xcodebuild -version

      - name: Verify project
        run: |
          set -e

          echo "=== Working directory ==="
          pwd

          echo "=== Project contents ==="
          ls -la

          echo "=== Verify Xcode project ==="
          test -d OptionAnalyzer.xcodeproj
          test -f OptionAnalyzer.xcodeproj/project.pbxproj

          echo "Project file:"
          ls -lh OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Show project information
        run: |
          set -e

          echo "=== Project information ==="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Verify scheme
        run: |
          set -e

          echo "=== Scheme files ==="

          find OptionAnalyzer.xcodeproj \
            -type f \
            -name "*.xcscheme" \
            -print

          test -f \
            OptionAnalyzer.xcodeproj/xcshareddata/xcschemes/OptionAnalyzer.xcscheme

          echo "OptionAnalyzer scheme found."

      - name: Clean build directory
        run: |
          set -e

          rm -rf "$PWD/build"
          rm -rf "$PWD/artifacts"

          mkdir -p "$PWD/build"
          mkdir -p "$PWD/artifacts"

      - name: Show build settings
        run: |
          set -e

          echo "=== Build settings ==="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -configuration Debug \
            -showBuildSettings

      - name: Build OptionAnalyzer
        run: |
          set -o pipefail

          echo "=== Starting iOS build ==="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify application
        run: |
          set -e

          echo "=== Searching for OptionAnalyzer.app ==="

          find "$PWD/build" \
            -type d \
            -name "OptionAnalyzer.app" \
            -print

          APP_PATH="$PWD/build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: OptionAnalyzer.app was not created."
            exit 1
          fi

          echo "=== Application successfully created ==="
          ls -lah "$APP_PATH"

      - name: Package iOS application
        run: |
          set -e

          APP_PATH="$PWD/build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          rm -rf artifacts/OptionAnalyzer.app

          ditto \
            "$APP_PATH" \
            "artifacts/OptionAnalyzer.app"

          cd artifacts

          zip -r \
            OptionAnalyzer-iOS-Debug.zip \
            OptionAnalyzer.app

          echo "=== Package created ==="
          ls -lh OptionAnalyzer-iOS-Debug.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip
          if-no-files-found: error
