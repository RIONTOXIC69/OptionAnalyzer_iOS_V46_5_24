name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # XCODE
      # ------------------------------------------------------------

      - name: Select available Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " INSTALLED XCODE VERSIONS"
          echo "=========================================="

          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=""

          for candidate in \
            "/Applications/Xcode_16.4.app" \
            "/Applications/Xcode_16.3.app" \
            "/Applications/Xcode_16.2.app" \
            "/Applications/Xcode_16.1.app" \
            "/Applications/Xcode_16.0.app" \
            "/Applications/Xcode.app"
          do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: No supported Xcode installation found."
            exit 1
          fi

          echo "Using Xcode:"
          echo "$XCODE_APP"

          sudo xcode-select -s "$XCODE_APP"

          echo "=========================================="
          echo " SELECTED XCODE"
          echo "=========================================="

          xcode-select -p
          xcodebuild -version

      # ------------------------------------------------------------
      # XCODEGEN
      # ------------------------------------------------------------

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " INSTALLING XCODEGEN"
          echo "=========================================="

          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen already available."
          else
            echo "Installing XcodeGen with Homebrew..."
            brew update
            brew install xcodegen
          fi

          echo "XcodeGen executable:"
          command -v xcodegen

          echo "XcodeGen version:"
          xcodegen version

      # ------------------------------------------------------------
      # VERIFY SOURCE FILES
      # ------------------------------------------------------------

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFYING SOURCE FILES"
          echo "=========================================="

          required_files=(
            "project.yml
 OptionAnalyzer/AnalyzerViewModel.swift
 OptionAnalyzer/APIModels.swift
 OptionAnalyzer/APIService.swift
 OptionAnalyzer/ContentView.swift
 OptionAnalyzer/ExecutionView.swift
 OptionAnalyzer/OptionAnalyzerApp.swift
 API/APIConfig.swift
 Views/DashboardView.swift
 Views/StageAnalysisView.swift
 Info.plist
 )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing:"
              echo "$file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "All required source files found."

      # ------------------------------------------------------------
      # VERIFY XCODEGEN SPEC
      # ------------------------------------------------------------

      - name: Verify XcodeGen specification
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFYING project.yml"
          echo "=========================================="

          echo "--- project.yml ---"
          cat project.yml
          echo "--- end project.yml ---"

          echo ""
          echo "Running XcodeGen validation..."

          xcodegen dump \
            --spec project.yml \
            > /tmp/OptionAnalyzer-xcodegen-dump.yml

          test -s /tmp/OptionAnalyzer-xcodegen-dump.yml

          echo "XcodeGen specification accepted."

      # ------------------------------------------------------------
      # GENERATE FRESH XCODE PROJECT
      # ------------------------------------------------------------

      - name: Generate fresh Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " GENERATING FRESH XCODE PROJECT"
          echo "=========================================="

          rm -rf OptionAnalyzer.xcodeproj

          echo "Running:"
          echo "xcodegen generate --spec project.yml"

          xcodegen generate \
            --spec project.yml

          echo ""
          echo "=========================================="
          echo " GENERATED PROJECT"
          echo "=========================================="

          if [ ! -d "OptionAnalyzer.xcodeproj" ]; then
            echo "ERROR: OptionAnalyzer.xcodeproj was not generated."
            exit 1
          fi

          if [ ! -f "OptionAnalyzer.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: project.pbxproj was not generated."
            exit 1
          fi

          find OptionAnalyzer.xcodeproj \
            -maxdepth 4 \
            -type f \
            -print

          echo ""
          echo "Fresh Xcode project generated successfully."

      # ------------------------------------------------------------
      # VERIFY GENERATED PROJECT
      # ------------------------------------------------------------

      - name: Verify generated Xcode project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFYING GENERATED PROJECT"
          echo "=========================================="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      # ------------------------------------------------------------
      # VERIFY SCHEME
      # ------------------------------------------------------------

      - name: Verify generated scheme
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFYING GENERATED SCHEME"
          echo "=========================================="

          SCHEME_PATH="OptionAnalyzer.xcodeproj/xcshareddata/xcschemes/OptionAnalyzer.xcscheme"

          find OptionAnalyzer.xcodeproj \
            -type f \
            -name "*.xcscheme" \
            -print

          if [ ! -f "$SCHEME_PATH" ]; then
            echo "ERROR: Shared OptionAnalyzer scheme was not generated."
            exit 1
          fi

          echo ""
          echo "OptionAnalyzer shared scheme found."

          echo ""
          echo "--- Scheme references ---"

          grep -n \
            -E "BlueprintIdentifier|BuildableName|BlueprintName" \
            "$SCHEME_PATH" || true

      # ------------------------------------------------------------
      # CLEAN BUILD DATA
      # ------------------------------------------------------------

      - name: Clean Xcode build data
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CLEANING BUILD DATA"
          echo "=========================================="

          rm -rf "$PWD/build"
          rm -rf "$PWD/artifacts"
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"

          mkdir -p "$PWD/build"
          mkdir -p "$PWD/artifacts"

          echo "Build directories prepared."

      # ------------------------------------------------------------
      # SHOW BUILD SETTINGS
      # ------------------------------------------------------------

      - name: Show generated build settings
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " GENERATED BUILD SETTINGS"
          echo "=========================================="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -configuration Debug \
            -showBuildSettings

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Build OptionAnalyzer
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo " BUILDING OPTIONANALYZER"
          echo "=========================================="

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      # ------------------------------------------------------------
      # LOCATE APP
      # ------------------------------------------------------------

      - name: Locate application
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " LOCATING OPTIONANALYZER.APP"
          echo "=========================================="

          find "$PWD/build" \
            -type d \
            -name "OptionAnalyzer.app" \
            -print

          APP_PATH="$PWD/build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: OptionAnalyzer.app was not created."
            echo ""
            echo "Build directory contents:"
            find "$PWD/build" -maxdepth 6 -print || true
            exit 1
          fi

          echo ""
          echo "Application found:"
          echo "$APP_PATH"

          ls -lah "$APP_PATH"

      # ------------------------------------------------------------
      # PACKAGE
      # ------------------------------------------------------------

      - name: Package iOS application
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " PACKAGING IOS APPLICATION"
          echo "=========================================="

          APP_PATH="$PWD/build/Build/Products/Debug-iphoneos/OptionAnalyzer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Application bundle not found."
            exit 1
          fi

          rm -rf artifacts/OptionAnalyzer.app

          ditto \
            "$APP_PATH" \
            "artifacts/OptionAnalyzer.app"

          cd artifacts

          rm -f OptionAnalyzer-iOS-Debug.zip

          zip -r \
            OptionAnalyzer-iOS-Debug.zip \
            OptionAnalyzer.app

          echo ""
          echo "Package created:"
          ls -lh OptionAnalyzer-iOS-Debug.zip

      # ------------------------------------------------------------
      # UPLOAD ARTIFACT
      # ------------------------------------------------------------

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip
          if-no-files-found: error
