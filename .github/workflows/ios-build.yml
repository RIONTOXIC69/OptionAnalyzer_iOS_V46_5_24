name: OptionAnalyzer iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build OptionAnalyzer
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show macOS and Xcode
        run: |
          sw_vers
          echo "Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          echo "Selected Xcode:"
          xcode-select -p
          xcodebuild -version

      - name: Inspect project
        run: |
          echo "Working directory:"
          pwd

          echo "Project:"
          ls -la

          echo "Xcode project:"
          find . -maxdepth 2 -name "*.xcodeproj" -print

          echo "Schemes:"
          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

      - name: Verify Swift sources
        run: |
          echo "Swift files:"
          find . -name "*.swift" -print

          echo "Info.plist:"
          plutil -lint Info.plist

      - name: Build iOS app
        run: |
          set -o pipefail

          rm -rf build

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify .app
        run: |
          echo "Searching for OptionAnalyzer.app..."

          find build \
            -type d \
            -name "OptionAnalyzer.app" \
            -print

          test -d \
            build/Build/Products/Debug-iphoneos/OptionAnalyzer.app

      - name: Package iOS app
        run: |
          mkdir -p artifacts

          ditto \
            build/Build/Products/Debug-iphoneos/OptionAnalyzer.app \
            artifacts/OptionAnalyzer.app

          cd artifacts

          zip -r \
            OptionAnalyzer-iOS-Debug.zip \
            OptionAnalyzer.app

          ls -lh OptionAnalyzer-iOS-Debug.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip