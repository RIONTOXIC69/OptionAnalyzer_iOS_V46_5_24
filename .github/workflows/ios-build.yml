name: Diagnose OptionAnalyzer Xcode Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app
          echo "Xcode:"
          xcodebuild -version

      - name: Inspect project files
        run: |
          echo "Working directory:"
          pwd

          echo "Project:"
          ls -la OptionAnalyzer.xcodeproj

          echo "pbxproj:"
          ls -lh OptionAnalyzer.xcodeproj/project.pbxproj

          echo "First 120 lines:"
          sed -n '1,120p' OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Validate pbxproj syntax
        run: |
          plutil -lint OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Check project file structure
        run: |
          grep -n "PBXProject" OptionAnalyzer.xcodeproj/project.pbxproj
          grep -n "PBXNativeTarget" OptionAnalyzer.xcodeproj/project.pbxproj
          grep -n "XCConfigurationList" OptionAnalyzer.xcodeproj/project.pbxproj
          grep -n "XCBuildConfiguration" OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Inspect target names
        run: |
          echo "Native targets:"
          grep -n "isa = PBXNativeTarget" OptionAnalyzer.xcodeproj/project.pbxproj

          echo "Target name:"
          grep -n "name = OptionAnalyzer" OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Check source references
        run: |
          echo "Swift files:"
          find . -type f -name "*.swift" -print

          echo "Referenced Swift files:"
          grep -n "lastKnownFileType = sourcecode.swift" \
            OptionAnalyzer.xcodeproj/project.pbxproj

      - name: Check build configurations
        run: |
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" \
            OptionAnalyzer.xcodeproj/project.pbxproj

          grep -n "SWIFT_VERSION" \
            OptionAnalyzer.xcodeproj/project.pbxproj || true

          grep -n "IPHONEOS_DEPLOYMENT_TARGET" \
            OptionAnalyzer.xcodeproj/project.pbxproj || true

      - name: Test xcodebuild project listing
        run: |
          set +e

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -list

          STATUS=$?

          echo "xcodebuild -list exit code: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo "xcodebuild -list failed."
            exit "$STATUS"
          fi

      - name: Diagnose complete
        run: |
          echo "======================================"
          echo "PROJECT DIAGNOSTIC COMPLETED"
          echo "======================================"