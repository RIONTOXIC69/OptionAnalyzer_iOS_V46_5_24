name: OptionAnalyzer iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app
          xcodebuild -version

      - name: Verify project files
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -name "*.xcodeproj" -print
          find . -maxdepth 3 -name "*.xcscheme" -print

      - name: Build iOS app
        run: |
          set -o pipefail

          xcodebuild \
            -project OptionAnalyzer.xcodeproj \
            -scheme OptionAnalyzer \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify app
        run: |
          echo "Checking build output..."
          find build/Build/Products -maxdepth 2 -type d -name "*.app" -print
          test -d build/Build/Products/Debug-iphoneos/OptionAnalyzer.app

      - name: Package iOS app
        run: |
          mkdir -p artifacts

          ditto \
            build/Build/Products/Debug-iphoneos/OptionAnalyzer.app \
            artifacts/OptionAnalyzer.app

          cd artifacts
          zip -r OptionAnalyzer-iOS-Debug.zip OptionAnalyzer.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: OptionAnalyzer-iOS-Debug
          path: artifacts/OptionAnalyzer-iOS-Debug.zip